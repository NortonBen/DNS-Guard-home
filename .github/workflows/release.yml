name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # Giao diện phải biên dịch trước: gói internal/web nhúng kết quả vào binary.
      - name: Biên dịch giao diện
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # CGO tắt nên biên dịch chéo chỉ là đổi hai biến môi trường — không cần
      # cross toolchain, vì driver SQLite là Go thuần.
      - name: Biên dịch binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p out
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "out/dnsguard-linux-${arch}" ./cmd/dnsguard
            GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "out/dnsguard-cli-linux-${arch}" ./cmd/dnsguard-cli
          done

      # scripts/install.sh xác minh file tải về bằng đúng tên trong bảng này.
      - name: Tính checksum
        working-directory: out
        run: sha256sum dnsguard-* > checksums.txt

      - name: Tạo bản phát hành
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/dnsguard-linux-amd64
            out/dnsguard-linux-arm64
            out/dnsguard-cli-linux-amd64
            out/dnsguard-cli-linux-arm64
            out/checksums.txt
          generate_release_notes: true

  image:
    name: Ảnh Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
