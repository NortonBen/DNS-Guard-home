<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DNSGuard</title>
    <meta name="description" content="Quản trị blocklist DNS lấy domain làm trung tâm" />

    <!--
      SVG là bản chính vì nó sắc nét ở mọi tỉ lệ màn hình; .ico chỉ để đỡ cho trình
      duyệt cũ chưa đọc được favicon SVG (Safari trước bản 16).
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Màu thanh địa chỉ khớp với nền trang, tránh vệt màu lạ ở mép trên. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <script>
      /*
       * Áp chế độ sáng/tối trước khi trình duyệt vẽ khung hình đầu tiên.
       *
       * Nếu để React làm việc này trong useEffect, trang sẽ hiện màu sáng một nhịp
       * rồi mới chuyển sang tối — đúng thứ người dùng thấy là "không nhớ lựa chọn".
       * Script đồng bộ trong <head> chạy trước lần vẽ đầu tiên nên không có nháy màu.
       */
      (function () {
        try {
          var saved = localStorage.getItem('dnsguard.theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* Chế độ riêng tư chặn localStorage: cứ để mặc định của hệ thống. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
